<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatGrid {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.15); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.15; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      .bg-grid { animation: floatGrid 10s ease-in-out infinite; }
      .node { transform-box: fill-box; transform-origin: center; animation: pulseNode 4s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 8 8; animation: dashStream 2s linear infinite; }
      .scan { animation: scanline 6s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#titleGrad); }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #8b949e; letter-spacing: 1px; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace; font-size: 13px; fill: #58a6ff; font-weight: 600; }
    </style>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Background Grid & Network Elements -->
  <g class="bg-grid" opacity="0.25">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#30363d" stroke-width="1"/>
    <path d="M100 0 V300 M300 0 V300 M500 0 V300 M700 0 V300 M900 0 V300 M1100 0 V300" stroke="#30363d" stroke-width="1"/>
  </g>

  <!-- Dynamic CT Log Data Stream Animation (In Background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 50 220 Q 300 260 600 210 T 1150 240" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <path class="stream-line" d="M 80 80 Q 400 40 750 90 T 1120 60" stroke="#bc8cff" stroke-width="2" fill="none"/>
    
    <!-- Animated Nodes -->
    <circle class="node" cx="200" cy="240" r="15" fill="#58a6ff" style="animation-delay: 0s;"/>
    <circle class="node" cx="600" cy="210" r="20" fill="#bc8cff" style="animation-delay: 1s;"/>
    <circle class="node" cx="950" cy="225" r="12" fill="#3fb950" style="animation-delay: 2s;"/>
    <circle class="node" cx="350" cy="50" r="18" fill="#3fb950" style="animation-delay: 0.5s;"/>
    <circle class="node" cx="800" cy="85" r="14" fill="#58a6ff" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Ambient Scanning Effect (Stays Behind Foreground Text) -->
  <rect class="scan" x="0" y="0" width="1200" height="15" fill="#58a6ff" filter="url(#glow)"/>

  <!-- Foreground Main Content (Clear, Legible, Shielded) -->
  <g transform="translate(60, 65)">
    <!-- Shield / Lock Security Icon -->
    <g transform="translate(0, 8)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
      <path d="M32 16 L48 24 V36 C48 46 32 52 32 52 C32 52 16 46 16 36 V24 L32 16 Z" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="4" fill="#3fb950"/>
    </g>

    <!-- Tag/Pill -->
    <g transform="translate(84, 4)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#1f6feb" opacity="0.2"/>
      <rect x="0" y="0" width="220" height="26" rx="13" fill="none" stroke="#58a6ff" stroke-width="1"/>
      <text x="14" y="17" class="badge-text">🔒 CERTIFICATE TRANSPARENCY</text>
    </g>

    <!-- Main Title -->
    <text x="84" y="68" class="title-text" filter="url(#glow)">Awesome CT Monitoring 🚀</text>

    <!-- Subtitle -->
    <text x="84" y="105" class="subtitle-text">Curated SaaS Platforms, Open-Source Tools &amp; Security Pipelines for Real-Time CT Log Auditing</text>
    <text x="84" y="130" class="subtitle-text" opacity="0.75">Subdomain Discovery • Phishing Domain Alerts • Unauthorized Issuance Detection • PKI Visibility</text>
  </g>
</svg>
